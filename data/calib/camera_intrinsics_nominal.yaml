  cols: 3
  data: [644.1408246, 0, 398.5361241, 0, 641.7347972, 310.5066165, 0, 0, 1]
distortion_model: plumb_bob
distortion_coefficients:
  rows: 1
  cols: 5
  data: [0.1639958234, -0.271840031, 0.00105584166, -0.001665559737, 0]
rectification_matrix:
  rows: 3
  cols: 3
  data: [1, 0, 0, 0, 1, 0, 0, 0, 1]
